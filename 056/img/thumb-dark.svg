<text class="h" x="16" y="22">What still falls back</text>
<text class="m" x="16" y="37">hazel-jit, build 50: the evaluator's 313 programs</text>
<rect class="ok" x="16.0" y="70" width="214.4" height="34"/><rect class="st" x="230.4" y="70" width="1.8" height="34"/><rect class="ty" x="232.2" y="70" width="23.0" height="34"/><rect class="ru" x="255.2" y="70" width="45.1" height="34"/><rect class="li" x="300.3" y="70" width="3.7" height="34"/>
<text class="w" x="123" y="92" text-anchor="middle">233</text>
<text class="t" x="16" y="62">compiled, the same value</text>
<path class="br" d="M230.4,112 L230.4,118 L304,118 L304,112"/>
<text class="t" x="304" y="132" text-anchor="end">80 to the interpreter</text>
<text class="k" x="16" y="156">holes · ill-typed · unbound names · stuck terms</text>
<text class="k" x="16" y="172">and four limits: what to lift, what to decide,</text>
