# (ticket 795, ^report(54)) hazel-jit's lists as cells against lists as cells and array segments (the hybrid), every game,
# with two builds of the hazeljs package's hazel-lib.js on the same runner: the package branch's (cells) and the same with
# hazel-jit-lists merged (hybrid). The jit and the ahead-of-time ways only (node/package-bench.mjs --no-interpreted): the
# interpreter is the same in both. One runner per game; each build's commit is recorded in its results (Hazel.build).
name: package bench
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
env:
  CELLS_URL: https://build.hazel.org/hazeljs/hazel-lib.js
  HYBRID_URL: https://build.hazel.org/hazeljs-lists/hazel-lib.js
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: [i-ching, tarot, astrology, checkers, go, minesweeper, mahjong, solitaire, mahjong-solitaire, pinball, downhill, bricks, snake, trails, starwave, bugs, dig]
    steps:
      - uses: actions/checkout@v4
      # the package's own files (index.js, index.mjs) from 0.0.11; its hazel-lib.js replaced by each build's
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/hazeljs
          ref: b149ed58f25aa5b938d6459363861dbb95ff5f5a
          path: hazeljs-pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The machine, and the two builds
        run: |
          mkdir -p bench
          { nproc; grep -m1 'model name' /proc/cpuinfo; node --version; } | tee bench/${{ matrix.game }}-machine.txt
          cp -r hazeljs-pkg hazeljs-cells && curl -fsSL -A "Mozilla/5.0" "$CELLS_URL" -o hazeljs-cells/hazel-lib.js
          cp -r hazeljs-pkg hazeljs-hybrid && curl -fsSL -A "Mozilla/5.0" "$HYBRID_URL" -o hazeljs-hybrid/hazel-lib.js
      - name: Cells, then the hybrid
        run: |
          ulimit -s unlimited || ulimit -s 65536
          node --stack-size=30000 --max-old-space-size=6000 node/package-bench.mjs ${{ matrix.game }} hazeljs-cells bench/${{ matrix.game }}-cells.json --no-interpreted | tee bench/${{ matrix.game }}-cells.txt
          node --stack-size=30000 --max-old-space-size=6000 node/package-bench.mjs ${{ matrix.game }} hazeljs-hybrid bench/${{ matrix.game }}-hybrid.json --no-interpreted | tee bench/${{ matrix.game }}-hybrid.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bench-${{ matrix.game }}
          path: bench/
